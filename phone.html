<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bamboo · Phone preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8ece5;font:13px system-ui;color:#40533f;display:grid;justify-items:center;gap:16px;padding:24px}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}button{font:inherit;cursor:pointer}header button{border:1px solid #bac7b5;background:#f9faf7;color:inherit;padding:10px 16px;border-radius:20px}.phone{zoom:var(--phone-scale,1);width:414px;padding:10px;background:#263b2e;border:2px solid #55705a;border-radius:40px;box-shadow:0 15px 55px #2a402522}.screen{position:relative;width:390px;height:844px;overflow:hidden;border-radius:28px;background:#e2e9da}iframe{display:block;width:100%;height:100%;border:0;background:#f6f8f1}.launcher{height:100%;padding:38px 28px;display:flex;flex-direction:column;align-items:center;background:radial-gradient(ellipse at 70% 22%,#f8f9ef 0,transparent 50%),linear-gradient(155deg,#d4e1cb,#e7ebdf 55%,#afc3a3);position:relative}.status{width:100%;display:flex;justify-content:space-between;font-size:12px}.date{margin:42px 0 0;font-size:17px}.clock{font-size:76px;letter-spacing:-5px;font-weight:300;margin:5px 0 28px}.app-icon{border:0;background:none;color:#345340;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px;min-width:100px}.app-mark{display:grid;place-items:center;width:76px;height:76px;border-radius:20px;background:#365c45;color:#f2f6e8;font-weight:750;font-size:43px;letter-spacing:-4px;padding-right:5px;box-shadow:0 6px 18px #294a3525}.app-icon:focus-visible{outline:2px solid #365c45;border-radius:24px}.hint{margin-top:25px;font-size:12px;color:#617759}.home-bar{position:absolute;bottom:12px;width:126px;height:5px;background:#365340;border-radius:10px;opacity:.65}[hidden]{display:none!important}small{color:#697563}
@media(max-width:450px){body{padding:0;gap:0}header{padding:10px;font-size:11px}.phone{zoom:1;width:100%;padding:0;border:0;border-radius:0;box-shadow:none}.screen{width:100%;height:calc(100dvh - 100px);min-height:540px;border-radius:0}body>small{display:none}}
.home-widget{width:100%;height:170px;position:relative;text-align:left;border:1px solid #ffffffb0;border-radius:26px;padding:20px 24px;background:#fafbf4e8;color:#345340;box-shadow:0 6px 22px #3653400b;margin-bottom:25px}.widget-brand{display:block;font-size:12px;font-weight:650;margin-bottom:15px}.widget-count{font-size:43px;line-height:1;font-weight:600;display:block}.widget-unit{font-size:13px;display:block;margin-top:5px}.widget-note{display:block;font-size:10px;color:#798772;margin-top:9px}.widget-bamboo{position:absolute;right:23px;bottom:22px;width:80px;height:120px}.home-widget:focus-visible{outline:2px solid #365c45;outline-offset:4px}
.home-widget{margin-bottom:12px}.widget-slider{width:100%;margin:0 0 20px;padding:0 10px}.widget-slider label{display:flex;justify-content:space-between;font-size:11px;color:#536e4d}.widget-slider input{width:100%;height:32px;accent-color:#496f50;margin:4px 0;cursor:pointer}.range-labels{display:flex;justify-content:space-between;font-size:9px;color:#718466}.widget-bamboo{width:100px;height:130px;right:12px}.clock{margin-bottom:18px}.date{margin-top:25px}.app-mark{padding:0;background:none;box-shadow:0 5px 14px #294a3514}.widget-logo{width:19px;height:19px;vertical-align:middle;margin-right:3px}.widget-bamboo{width:124px;height:155px;right:9px;bottom:9px}.widget-brand{margin-bottom:13px}.widget-count{font-size:48px;font-weight:550;letter-spacing:-2px}.widget-note{max-width:150px}.home-widget{height:184px}</style></head><body><header><span><strong>Bamboo</strong> · Phone preview</span><button id="refresh">Reload latest</button><button id="phone-home" hidden>Phone home</button></header><div class="phone"><div class="screen"><section class="launcher" id="launcher" aria-label="Phone home screen"><div class="status"><span>9:41</span><span aria-label="Full signal and battery">•••• ▰</span></div><p class="date" id="date"></p><div class="clock" aria-hidden="true">9:41</div><button class="home-widget" id="open-widget" aria-label="Bamboo widget, 3-day streak. Open Bamboo"><span class="widget-brand"><img class="widget-logo" src="assets/bamboo-icon.svg?v=growing-tubes-5" alt=""> bamboo ↗</span><span class="widget-count" id="preview-count">3</span><span class="widget-unit">day streak</span><span class="widget-note">A little good, every day.</span><svg class="widget-bamboo" id="preview-plant" viewBox="0 0 160 200" aria-hidden="true"></svg></button><div class="widget-slider"><label for="preview-day">Preview streak <output id="preview-day-label">3 days</output></label><input id="preview-day" type="range" min="1" max="90" value="3" aria-label="Preview streak days"><div class="range-labels"><span>1 day</span><span>90 days</span></div></div><button class="app-icon" id="open-app" aria-label="Open Bamboo"><img class="app-mark" src="assets/bamboo-icon.svg?v=growing-tubes-5" alt="" aria-hidden="true"><span>Bamboo</span></button><p class="hint">A little good, every day.</p><div class="home-bar" aria-hidden="true"></div></section><iframe id="app" title="Bamboo mobile application" hidden></iframe></div></div><small>Local demo · Same project files · No real payments</small>
<script src="giving/scene.js?v=growing-tubes-5"></script>
<script>
const fitPhone=()=>document.documentElement.style.setProperty('--phone-scale',Math.min(1,Math.max(.35,(innerHeight-130)/868)));fitPhone();addEventListener('resize',fitPhone);
let previewDay=3,previewFrame=0;
const reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)');
function drawPreview(day){previewDay=day;document.getElementById('preview-plant').innerHTML=BambooGivingScene.widget(day);document.getElementById('preview-count').style.color=BambooGivingScene.streakColor(day);}

function changePreview(){const day=Number(document.getElementById('preview-day').value);document.getElementById('preview-count').textContent=day;document.getElementById('preview-day-label').textContent=day+' '+(day===1?'day':'days');document.getElementById('open-widget').setAttribute('aria-label','Bamboo widget, '+day+'-day streak. Open Bamboo');cancelAnimationFrame(previewFrame);if(reduced?.matches){drawPreview(day);return;}const from=previewDay,start=performance.now();function frame(now){const t=Math.min(1,(now-start)/500);drawPreview(from+(day-from)*t*t*(3-2*t));if(t<1)previewFrame=requestAnimationFrame(frame);}previewFrame=requestAnimationFrame(frame);}
document.getElementById('preview-day').addEventListener('input',changePreview);drawPreview(3);
const app=document.getElementById('app'),launcher=document.getElementById('launcher'),home=document.getElementById('phone-home');
document.getElementById('date').textContent=new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric'}).format(new Date());
function phoneHome(){app.hidden=true;app.removeAttribute('src');launcher.hidden=false;home.hidden=true;document.getElementById('open-app').focus();}
function openApp(){app.src='index.html?preview='+Date.now();launcher.hidden=true;app.hidden=false;home.hidden=false;}
document.getElementById('open-app').addEventListener('click',openApp);document.getElementById('open-widget').addEventListener('click',openApp);
document.getElementById('refresh').addEventListener('click',phoneHome);home.addEventListener('click',phoneHome);
</script></body></html>
