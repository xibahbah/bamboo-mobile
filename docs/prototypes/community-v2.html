<div id="bamboo-community">
<style>
#bamboo-community{--paper:light-dark(#fff,#202020);--ink:light-dark(#222,#eee);--soft:light-dark(#f4f4f2,#303030);--line:light-dark(#d3d3d0,#555);--dim:light-dark(#60605b,#bbb);font:15px/1.6 system-ui,sans-serif;color:var(--ink)}
#bamboo-community *{box-sizing:border-box}#bamboo-community h2,#bamboo-community h3,#bamboo-community p{margin:0}#bamboo-community h2{font-size:20px}#bamboo-community h3{font-size:16px}#bamboo-community button{font:inherit;min-height:44px;padding:8px 12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px}#bamboo-community .primary,#bamboo-community button[aria-pressed=true]{background:var(--ink);color:var(--paper)}#bamboo-community button:disabled{opacity:.5}#bamboo-community .hint{font-size:13px;color:var(--dim)}#bamboo-community .caption{padding:0 96px 16px 0}#bamboo-community .app{max-width:600px;margin:auto;background:var(--paper);border:1px solid var(--line)}#bamboo-community .sticky{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--line)}#bamboo-community .brand{padding:12px 16px;display:flex;justify-content:space-between;align-items:center}#bamboo-community .streak{background:var(--soft);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}#bamboo-community nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px}#bamboo-community nav button{flex:1;padding:8px}#bamboo-community .block{padding:18px 16px;display:grid;gap:12px;border-bottom:1px solid var(--line)}#bamboo-community .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}#bamboo-community .author{display:flex;gap:10px;align-items:center;border:0;text-align:left;padding:0;min-width:0}#bamboo-community .avatar{display:grid;place-items:center;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:50%;width:40px;height:40px;flex:none}#bamboo-community .body{white-space:pre-wrap;overflow-wrap:anywhere}#bamboo-community label{display:grid;gap:6px}#bamboo-community textarea,#bamboo-community input,#bamboo-community select{font:16px/1.6 system-ui,sans-serif;color:var(--ink);background:var(--paper);padding:10px;border:1px solid var(--line);border-radius:5px;width:100%;min-width:0}#bamboo-community textarea{min-height:130px;resize:vertical}#bamboo-community .wall{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}#bamboo-community .person{display:grid;justify-items:center;gap:6px}#bamboo-community .notice{padding:8px 16px;min-height:40px}#bamboo-community .check{display:flex;align-items:center;gap:10px}#bamboo-community .check input{width:20px;height:20px}#bamboo-community .prompt{background:var(--soft)}
#bamboo-community #community-nav{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);z-index:3;flex-wrap:nowrap;padding:8px 4px;gap:2px}#bamboo-community #community-nav button{min-width:0;padding:8px 4px;font-size:13px}#bamboo-community .map{position:relative;height:230px;background:repeating-linear-gradient(0deg,transparent,transparent 44px,var(--line) 45px,transparent 46px),repeating-linear-gradient(90deg,var(--soft),var(--soft) 64px,var(--line) 65px,var(--soft) 66px)}#bamboo-community .map button{position:absolute}#bamboo-community .map button:first-child{left:8%;top:25px}#bamboo-community .map button:nth-child(2){right:8%;top:95px}#bamboo-community .map button:nth-child(3){left:16%;bottom:15px}
</style>
<div class="caption"><h2>同一个社区，同一个主页</h2><p class="hint">UX v0.2 · 虚构人物与内容 · 操作仅在此预览生效</p></div>
<section class="app" aria-label="SD 竹筒社区主页">
<div class="sticky"><header class="brand"><strong>SD 竹筒</strong><span class="hint">San Diego</span></header><div class="streak" id="community-streak"></div></div>
<main id="community-main"></main><p class="notice hint" id="community-notice" aria-live="polite"></p><nav id="community-nav" aria-label="底部主要导航"></nav>
</section>
<script>
(()=>{
const root=document.getElementById('bamboo-community'),main=root.querySelector('#community-main'),notice=root.querySelector('#community-notice');
const people={maria:{name:'Maria',bio:'住在 San Diego。喜欢做饭，也喜欢听别人讲家里的故事。'},lin:{name:'Lin',bio:'想把家里的语言和记忆留在日常生活里。'},alex:{name:'Alex · 你',bio:'一起认识这个城市的人。'},city:{name:'社区团队',bio:'发布经过核实、获得公开同意的帮助进展。'}};
let posts=[{id:1,who:'maria',type:'食谱',text:'外婆教我的豆子炖饭。\n她总说，多放一点水，就能再多招待一个人。\n\n我的做法：洋葱炒软，加熟豆子和番茄炖煮，最后拌入米饭。你家也有“多一个人也够吃”的菜吗？',likes:12},{id:2,who:'lin',type:'文化与记忆',text:'我家把“吃饭了吗？”当作打招呼。搬来 SD 后，我才发现这句话也在说：我惦记着你。\n你家乡的哪一句话，让你感到被关心？',likes:8},{id:3,who:'city',type:'帮助近况',text:'本周，一份食品支持已经送达。\n这份帮助来自城市共同资金池。此匿名近况已获得当事人同意。',likes:21}];
let view='home',profile='maria',liked=new Set(),draft='',kind='生活故事',shared=false,paid=false,amount='0.10',confirm=false,promptDismissed=false,onwall=false,application=false,invitation=false,publishError='';
let place=0,chat='maria',message='',messages=[],notify=false,allowDM=true;
const places=[['社区厨房','食物支持领取点 · 虚构地点','开放安排需向工作人员确认。'],['文化餐桌','社区活动 · 虚构地点','带一道菜，或来听听别人家里的故事。'],['社区服务站','帮助咨询 · 虚构地点','可以私下询问申请帮助的方式。']];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(t,a,cls='')=>`<button type="button" data-action="${a}" class="${cls}">${t}</button>`;
function save(){window.openai?.setWidgetState?.({modelContent:{prototype:'community-home-v2',view},privateContent:{view,profile}}).catch(()=>{});}
function post(p){return `<article class="block"><button class="author" type="button" data-action="profile:${p.who}" aria-label="查看 ${esc(people[p.who].name)} 的主页"><span class="avatar" aria-hidden="true">${esc(people[p.who].name[0])}</span><span>${esc(people[p.who].name)}<span class="hint"> · ${p.type}</span></span></button><p class="body">${esc(p.text)}</p><div class="row"><button type="button" data-action="like:${p.id}" aria-pressed="${liked.has(p.id)}">${liked.has(p.id)?'已点赞':'♡ 点赞'} · ${p.likes+(liked.has(p.id)?1:0)}</button>${p.who==='alex'?button('撤回帖子','remove:'+p.id):''}</div></article>`;}
function render(){
root.querySelector('#community-streak').innerHTML=`<div><strong>${paid?'🌳 15':'🌱 14'} 天捐款 streak</strong><p class="hint">今天：${paid?'已投入心意':'尚未捐款'} · ${shared?'已分享':'尚未分享'}</p></div>${button(paid?'看看小树':'放一点心意','pot')}`;
const active=['compose','profile'].includes(view)?'home':['pot'].includes(view)?'finance':['chat'].includes(view)?'messages':['wall','help','edit','settings'].includes(view)?'me':view;
root.querySelector('#community-nav').innerHTML=[['home','主页'],['map','地图'],['finance','财务'],['messages','消息'],['me','我的']].map(([id,t])=>`<button type="button" data-action="${id}" aria-pressed="${active===id}">${t}</button>`).join('');
let html='';
if(view==='home')html=`<section class="block"><h3>今天想分享什么？</h3>${button('写一个帖子…','compose')}<div class="row">${button('一道家里的菜','recipe')}${button('一个家乡故事','culture')}</div></section>${!promptDismissed?`<section class="block prompt"><h3>你的生活，也能给别人一些温暖。</h3><p>一道食谱、一句家乡话、一段被关心的记忆，愿意分享哪一个？</p><div class="row">${button('我想分享','compose')}${button('暂时跳过','dismiss')}</div></section>`:''}${posts.map(post).join('')}`;
if(view==='compose')html=`<section class="block"><h2>分享给社区</h2><p class="hint">每个人都可以分享，不必讲自己的困难。</p><label>分享什么<select id="community-kind">${['生活故事','食谱','文化与记忆'].map(t=>`<option ${kind===t?'selected':''}>${t}</option>`).join('')}</select></label><label>你的帖子<textarea id="community-draft" maxlength="1200" placeholder="可以从：我家有一道菜… 开始。">${esc(draft)}</textarea></label><p class="hint">公开给社区 · 以 Alex 的名字发布 · 最多 1,200 字</p><p role="alert">${esc(publishError)}</p><div class="row">${button('发布演示帖子','publish','primary')}${button('返回，保留草稿','home')}</div></section>`;
if(view==='profile')html=`<section class="block">${button('返回社区','home')}<div class="row"><span class="avatar">${esc(people[profile].name[0])}</span><h2>${esc(people[profile].name)}</h2></div><p>${esc(people[profile].bio)}</p><p class="hint">公开帖子 · 不显示受助身份或捐款金额</p></section>${posts.filter(p=>p.who===profile).map(post).join('')||'<section class="block">还没有公开帖子。</section>'}`;
if(view==='pot')html=`<section class="block"><h2>城市共同竹筒</h2><p>大家的心意汇在一起，由管理员核实需要、安排帮助。</p>${paid?`<p>今天已模拟投入 $${Number(amount).toFixed(2)}。小树成长为连续 15 天。</p>${button('选择是否上墙','wall')}`:`<label>单次捐款金额（USD）<input id="community-amount" inputmode="decimal" value="${esc(amount)}" ${confirm?'readonly':''}></label><p role="alert">${esc(publishError)}</p>${confirm?`<p>确认将 $${Number(amount).toFixed(2)} 加入共同池。</p><div class="row">${button('模拟支付成功','pay','primary')}${button('修改金额','edit-amount')}</div>`:button('确认金额','confirm','primary')}`}<p class="hint">演示不扣款。实际小额结算及费用待设计。发帖和点赞不改变捐款 streak。</p></section>`;
if(view==='wall')html=`<section class="block"><h2>城市善意墙</h2><p>大家一起支持这个城市，也有伙伴选择不公开头像。</p><div class="wall">${['Mia','Jay','Sam','Lee',...(onwall?['Alex']:[])].map(n=>`<div class="person"><span class="avatar">${n[0]}</span><span>${n}</span></div>`).join('')}</div><p class="hint">演示头像 · 每个人一样大 · 不显示金额</p>${paid?`<p>你已连续参与 15 天，可以自愿加入。</p>${button(onwall?'移除我的头像':'同意公开我的 Alex 头像',onwall?'wall-off':'wall-on')}`:'<p>草案：连续捐款 15 天后邀请上墙。</p>'}</section>`;
if(view==='me')html=`<section class="block"><h2>${esc(people.alex.name)}</h2><p>你可以贡献，也可以在有需要时寻求帮助。</p>${button('我的公开帖子','profile:alex')}${button('我需要帮助 / 我的申请','help')}</section>${invitation?`<section class="block prompt"><h3>帮助已送达（演示）</h3><p>愿意把你生活中的一小部分带给社区吗？可以分享食谱、文化或故事，不需要提到这次帮助。</p><div class="row">${button('分享一道菜','recipe')}${button('以后再说','later')}</div><p class="hint">自愿分享，不影响现在或以后的帮助。</p></section>`:''}`;
if(view==='help')html=`<section class="block"><h2>${application?'我的申请':'私下申请帮助'}</h2>${application?`<p>示例食品支持申请：待核实。工作人员会私下确认需要。</p><p class="hint">下面仅用于预览收到帮助后的邀请，不改变真实申请状态。</p>${button('预览帮助送达后的邀请','invite')}`:`<p>此草图用食品支持作为示例。申请资料仅你与获授权的工作人员可见。</p>${button('提交演示申请','apply','primary')}`}<p class="hint">公开发帖不是申请帮助的条件。</p>${button('返回我的','me')}</section>`;
if(view==='profile'&&profile!=='alex')html+=`<section class="block">${button('给 '+esc(people[profile].name)+' 发消息','chat:'+profile)}</section>`;
if(view==='me')html+=`<section class="block"><h3>我的空间</h3>${button('编辑个人资料','edit')}${button('城市善意墙 / 展示选择','wall')}${button('设置','settings')}</section>`;
if(view==='map')html=`<section class="block"><h2>社区地图</h2><p class="hint">位置示意，非真实地图 · 不展示个人住址</p><div class="map" aria-label="三个虚构社区地点">${places.map((p,i)=>button(p[0],'place:'+i)).join('')}</div><h3>${places[place][0]}</h3><p>${places[place][1]}</p><p>${places[place][2]}</p>${button('咨询社区团队','chat:city')}</section>`;
if(view==='finance')html=`<section class="block"><h2>财务 · 城市共同池</h2><p>可安排余额：$${(150+(paid?Number(amount):0)).toFixed(2)}</p><p class="hint">模拟累计到账 $${(200+(paid?Number(amount):0)).toFixed(2)} · 已拨付 $50 · 待拨付 $0 · 费用暂按 $0</p>${button('放一点心意','pot','primary')}<h3>我的捐款记录</h3><p>${paid?'今天 · $'+Number(amount).toFixed(2)+' · 模拟成功':'今天还没有捐款记录。'}</p><h3>共同池支出</h3><p>食品支持 · $50 · 已送达（演示）</p><p class="hint">所有捐款汇入共同池，管理员按核实后的需要分配。记录不配对个人捐助者和受助者。</p></section>`;
if(view==='messages')html=`<section class="block"><h2>消息</h2><p class="hint">聊天草图 · 不会发送给真人</p>${button('Maria · 聊聊食谱','chat:maria')}${button('Lin · 聊聊家乡故事','chat:lin')}${button('社区团队 · 帮助咨询','chat:city')}</section>`;
if(view==='chat')html=`<section class="block">${button('返回消息','messages')}<h2>与 ${esc(people[chat].name)} 聊天</h2><p class="hint">首次消息作为聊天请求，对方接受后再继续交流。此处只预览。</p>${messages.filter(m=>m.to===chat).map(m=>`<p class="body">你：${esc(m.text)}<br><span class="hint">演示请求 · 未实际发送</span></p>`).join('')}<label>写一条消息<textarea id="community-message" maxlength="500">${esc(message)}</textarea></label>${button('预览发送请求','send','primary')}<p role="alert">${esc(publishError)}</p></section>`;
if(view==='edit')html=`<section class="block"><h2>编辑个人资料</h2><label>显示名称<input id="community-name" maxlength="24" value="${esc(people.alex.name)}"></label><label>自我介绍<textarea id="community-bio" maxlength="200">${esc(people.alex.bio)}</textarea></label><p class="hint">名称和介绍用于公开主页。</p>${button('保存演示资料','save-profile','primary')}${button('取消','me')}</section>`;
if(view==='settings')html=`<section class="block"><h2>设置</h2><label class="check"><input id="community-notify" type="checkbox" ${notify?'checked':''}>社区互动通知</label><label class="check"><input id="community-dm" type="checkbox" ${allowDM?'checked':''}>允许陌生人发送聊天请求</label><p class="hint">不发送每日催捐。关闭聊天请求不影响与社区团队的帮助沟通。</p>${button('保存演示设置','save-settings','primary')}${button('善意墙公开选择','wall')}</section>`;
main.innerHTML=html;
}
function go(v){view=v;publishError='';notice.textContent='';render();save();}
root.addEventListener('input',e=>{if(e.target.id==='community-draft')draft=e.target.value;if(e.target.id==='community-amount')amount=e.target.value;if(e.target.id==='community-message')message=e.target.value;});
root.addEventListener('change',e=>{if(e.target.id==='community-kind')kind=e.target.value;});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b))return;const a=b.dataset.action;if(!a)return;
if(['home','wall','pot','me','help','compose','map','finance','messages','edit','settings'].includes(a)){go(a);return;}
if(a.startsWith('place:')){place=Number(a.split(':')[1]);render();return;}
if(a.startsWith('chat:')){chat=a.split(':')[1];message='';go('chat');return;}
if(a==='send'){if(!message.trim()){publishError='先写一点内容。';render();return;}messages.push({to:chat,text:message.trim()});message='';publishError='';render();notice.textContent='已在草图中显示请求，没有发送给真人。';return;}
if(a==='save-profile'){people.alex.name=root.querySelector('#community-name').value.trim()||'Alex';people.alex.bio=root.querySelector('#community-bio').value;profile='alex';go('profile');notice.textContent='演示资料已更新。';return;}
if(a==='save-settings'){notify=root.querySelector('#community-notify').checked;allowDM=root.querySelector('#community-dm').checked;render();notice.textContent='演示设置已保存，仅此预览有效。';return;}
if(a.startsWith('profile:')){profile=a.split(':')[1];go('profile');return;}
if(a.startsWith('like:')){const id=Number(a.split(':')[1]);liked.has(id)?liked.delete(id):liked.add(id);render();notice.textContent=liked.has(id)?'已点赞，可以再次点击取消。':'已取消点赞。';return;}
if(a==='recipe'||a==='culture'){kind=a==='recipe'?'食谱':'文化与记忆';go('compose');return;}
if(a==='dismiss'){promptDismissed=true;render();return;}
if(a==='publish'){if(!draft.trim()){publishError='先写一点内容，再发布。';render();return;}posts.unshift({id:Date.now(),who:'alex',type:kind,text:draft.trim(),likes:0});draft='';shared=true;go('home');notice.textContent='演示帖子已发布。捐款 streak 未改变。';return;}
if(a.startsWith('remove:')){posts=posts.filter(p=>p.id!==Number(a.split(':')[1]));render();notice.textContent='帖子已撤回。';return;}
if(a==='confirm'){const n=Number(amount);if(!/^\d+(\.\d{1,2})?$/.test(amount)||n<=0||n>100000){publishError='请输入 $0.01 至 $100,000，最多两位小数。';render();return;}confirm=true;render();return;}
if(a==='edit-amount'){confirm=false;render();return;}
if(a==='pay'){if(!confirm||paid)return;paid=true;render();notice.textContent='模拟支付成功，连续天数更新为 15 天。';return;}
if(a==='wall-on'||a==='wall-off'){onwall=a==='wall-on'&&paid;render();return;}
if(a==='apply'){application=true;render();notice.textContent='演示申请已提交，没有发送私人资料。';return;}
if(a==='invite'){invitation=true;go('me');return;}
if(a==='later'){invitation=false;render();notice.textContent='邀请已收起。';}
});
function restore(s){const p=s?.privateContent;if(p&&['home','wall','pot','me','help','compose','profile','map','finance','messages','edit','settings'].includes(p.view)){view=p.view;profile=people[p.profile]?p.profile:'maria';}render();}
restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
})();
</script>
</div>
