<!doctype html>
<html lang="zh-Hans"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>竹筒 · 成长素材预览</title>
<link rel="stylesheet" href="assets/bamboo-motion.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#F8F5EB;color:#214E3B;font:16px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:30px 20px}h1{font-size:32px;margin:0}h2{font-size:20px;margin:0}p{margin:8px 0}.intro{max-width:640px;margin-bottom:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fffdf6;border:1px solid #d8dfcb;border-radius:26px;padding:24px}.art{height:330px;display:flex;align-items:center;justify-content:center}.controls{display:flex;flex-wrap:wrap;gap:8px}button{border:1px solid #bac9ae;border-radius:18px;padding:10px 16px;min-height:44px;background:#e6edda;color:#214E3B;font:inherit}button[aria-pressed=true]{background:#214E3B;color:#fff}input[type=range]{width:100%;accent-color:#527a50}label{display:block}.small{font-size:13px;color:#56644f}.widget{background:#e6edda;border-radius:24px;width:180px;height:190px;padding:12px;margin-top:18px}.widget img{display:block;width:120px;height:120px;margin:auto}.sheet{width:100%;margin-top:24px;border-radius:24px}a{color:#214E3B}@media(max-width:650px){.grid{grid-template-columns:1fr}h1{font-size:26px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<main><div class="intro"><p>SD 竹筒 / MOTION STUDY</p><h1>一点心意，慢慢成林。</h1><p>30 个成长状态。从第一颗竹笋，到属于你的竹林。</p><p class="small">素材演示，不改变账户 streak，不发生捐款。超过 30 天的展示按已获得竹林累计。</p></div>
<div class="grid"><section class="card"><h2 id="day-title">第 1 天 · 小小竹笋</h2><div class="art"><img id="plant" class="bamboo-growth is-idle" src="assets/days/day-01.png" alt="第 1 天竹笋"></div><label for="day">预览成长天数 <output id="value">1</output></label><input id="day" type="range" min="1" max="90" value="1"><div class="controls"><button id="play" aria-pressed="false">播放 30 天成长</button><button id="motion" aria-pressed="true">轻轻摇摆：开</button></div><p class="small" id="groves">还在长大，第一片竹林等待你。</p></section>
<section class="card"><h2>共同竹筒</h2><div class="art"><img id="bank" class="bamboo-bank is-idle" src="assets/bamboo-bank.png" alt="竹制共同储蓄筒"></div><button id="thank">预览投入心意后的回应</button><p class="small">竹筒回应一次；成长状态由成功捐款后的服务器记录决定。</p><div class="widget"><strong id="widget-label">第 1 天</strong><img id="widget-img" src="assets/days/day-01.png" alt="Widget 静态素材示意"></div><p class="small">Widget 外观示意，未接入原生 iOS。</p></section></div>
<img class="sheet" src="assets/growth-contact-sheet.jpg" alt="第 1 至 30 天成长总览"><p><a href="assets/bamboo-growth.gif">成长 GIF</a> · <a href="assets/bamboo-grove-idle.gif">竹林摇摆 GIF</a> · <a href="TEAM-2H.md">三人分工</a></p>
</main>
<script>
const el=id=>document.getElementById(id);let timer=null;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let moving=!reduced;
function update(){const d=Number(el('day').value),stage=Math.min(d,30),groves=Math.floor(d/30),src=d>=90?'assets/groves-3.png':d>=60?'assets/groves-2.png':`assets/days/day-${String(stage).padStart(2,'0')}.png`;el('plant').src=src;el('plant').alt=`第 ${d} 天成长`;el('value').textContent=d;el('day-title').textContent=`第 ${d} 天 · ${d>=30?'竹林继续生长':d>14?'新竹相伴':d>6?'节节生长':'小小竹笋'}`;el('widget-img').src=src;el('widget-label').textContent=`第 ${d} 天 · ${groves} 片竹林`;el('groves').textContent=groves?`已拥有 ${groves} 片竹林${d%30?'，下一片正在长大。':'。'}`:'还在长大，第一片竹林等待你。';}
function stop(){clearInterval(timer);timer=null;el('play').textContent='播放 30 天成长';el('play').setAttribute('aria-pressed','false');}
el('day').oninput=()=>{stop();update();};el('play').onclick=()=>{if(timer){stop();return;}el('day').value=1;update();el('play').textContent='暂停';el('play').setAttribute('aria-pressed','true');timer=setInterval(()=>{el('day').value=Number(el('day').value)+1;update();if(Number(el('day').value)>=30)stop();},reduced?650:350);};
function motion(){el('plant').classList.toggle('is-idle',moving);el('bank').classList.toggle('is-idle',moving);el('motion').textContent=`轻轻摇摆：${moving?'开':'关'}`;el('motion').setAttribute('aria-pressed',String(moving));}el('motion').onclick=()=>{moving=!moving;motion();};el('thank').onclick=()=>{el('bank').classList.remove('is-success');void el('bank').offsetWidth;el('bank').classList.add('is-success');};el('bank').onanimationend=()=>el('bank').classList.remove('is-success');update();motion();
</script></html>
