<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bamboo — Segment growth preview</title><link rel="stylesheet" href="giving.css?v=segments-2"><style>header{position:absolute;top:18px;left:22px;right:22px;display:flex;justify-content:space-between;z-index:2;font-size:12px}a{color:inherit}footer{position:absolute;bottom:22px;left:24px;right:24px;text-align:center}input{width:min(360px,100%);accent-color:#365c42;display:block;margin:15px auto}button{padding:12px 22px;border:1px solid #ffffff70;border-radius:25px;background:#365c42;color:#edf3e6;min-height:44px}label{font-size:13px}.hint{font-size:10px;color:#4f6748}</style></head><body><main id="giving"><div id="landscape"></div><header><a href="../index.html?view=home#giving">Open app</a><span>Growth preview · no donations</span></header><footer><label for="day">Day <output id="value">0</output> · <span id="summary">A little beginning</span></label><input id="day" type="range" min="0" max="120" value="0" aria-label="Preview growth step"><button id="next">Grow one segment →</button><p class="hint">14 giving days = one bamboo · 84 giving days = six · then leaves</p></footer></main><script src="scene.js?v=hearts-3"></script><script>
const range=document.getElementById('day'),art=document.getElementById('landscape');let day=0,raf=0;
function draw(value){art.innerHTML=BambooGivingScene.render({days:value,panorama:true,aspect:innerWidth/innerHeight});document.getElementById('value').textContent=day;document.getElementById('summary').textContent=day>=84?'Growing leaves':`${Math.floor(day/14)} bamboo · ${day%14}/14 segments`;range.value=day;}
range.addEventListener('input',()=>{cancelAnimationFrame(raf);day=Number(range.value);draw(day);});
document.getElementById('next').addEventListener('click',()=>{cancelAnimationFrame(raf);const from=day;day=Math.min(120,day+1);const start=performance.now();function tick(now){const t=Math.min(1,(now-start)/1200);draw(from+(day-from)*t*t*(3-2*t));if(t<1)raf=requestAnimationFrame(tick);}if(matchMedia('(prefers-reduced-motion: reduce)').matches)draw(day);else raf=requestAnimationFrame(tick);});
addEventListener('resize',()=>draw(day));draw(day);
</script></body></html>
