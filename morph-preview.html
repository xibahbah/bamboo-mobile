<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bamboo — 1.8 second morph</title><style>
@font-face{font-family:Bamboo;src:url('assets/ui-font.woff2')}*{box-sizing:border-box}body{margin:0;background:#f5f7f2;color:#294b39;font:14px Bamboo,Arial,sans-serif}header{position:fixed;top:20px;left:24px;right:24px;display:flex;justify-content:space-between;z-index:2}a,button{font:12px Bamboo,Arial,sans-serif;color:#637369;background:none;border:0;min-height:44px;display:inline-flex;align-items:center;text-decoration:none;cursor:pointer}.stage{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center}.art{width:min(300px,86vw);height:auto;aspect-ratio:240/260;transform:translateY(-49px)}.wordmark{position:fixed;bottom:9%;left:0;right:0;text-align:center;font-size:30px;font-weight:650;letter-spacing:-1.4px}.scrubber{position:fixed;bottom:19%;left:50%;transform:translateX(-50%);width:min(270px,76vw);display:flex;align-items:center;gap:14px;color:#637369;font-size:10px}input{width:100%;accent-color:#40634f;min-height:44px}output{min-width:31px}.single header,.single .scrubber{display:none}button:focus-visible,a:focus-visible{outline:2px solid #40634f;outline-offset:4px}@media(max-height:650px){.art{width:min(260px,82vw);transform:translateY(-30px)}.wordmark{bottom:6%}.scrubber{bottom:16%}}
</style></head><body><header><a href="index.html?v=4">Play full experience →</a><button id="replay" type="button">Replay · 1.8s</button></header><main class="stage"><svg class="art" id="art" viewBox="0 0 240 260" role="img" aria-label="A coin enters a bamboo bank and grows into a grove"></svg></main><div class="scrubber"><input type="range" id="time" aria-label="Animation time in milliseconds" min="0" max="1800" step="1" value="0"><output id="time-label" for="time">0.0s</output></div><span class="wordmark">bamboo</span><script src="intro-motion.js?v=20261107-4"></script><script>
const art=document.getElementById('art'),slider=document.getElementById('time'),label=document.getElementById('time-label'),motion=window.BambooMotion;
let request=0,start=0;
function render(ms){const index=Math.min(motion.frames.length-1,Math.round(ms/motion.duration*(motion.frames.length-1)));art.innerHTML=motion.frames[index];slider.value=ms;label.textContent=(ms/1000).toFixed(1)+'s';}
function tick(now){const ms=Math.min(motion.duration,now-start);render(ms);if(ms<motion.duration)request=requestAnimationFrame(tick);}
function play(){cancelAnimationFrame(request);render(0);start=performance.now();if(matchMedia('(prefers-reduced-motion: reduce)').matches){render(motion.duration);return;}request=requestAnimationFrame(tick);}
slider.addEventListener('input',()=>{cancelAnimationFrame(request);render(Number(slider.value));});document.getElementById('replay').addEventListener('click',play);
const frame=new URLSearchParams(location.search).get('frame');if(['first','last'].includes(frame)){document.body.classList.add('single');render(frame==='first'?0:motion.duration);}else play();
</script></body></html>
