<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bamboo — Morph endpoints</title><style>
@font-face{font-family:Bamboo;src:url('assets/ui-font.woff2')}*{box-sizing:border-box}body{margin:0;background:#e6ecdf;color:#294b39;font:14px Bamboo,Arial,sans-serif}header{max-width:880px;margin:30px auto 24px;display:flex;align-items:center;justify-content:space-between;padding:0 24px}h1{font-size:22px;font-weight:600;letter-spacing:-.5px;margin:0 0 6px}p{color:#637369;margin:0;font-size:12px}a{color:#294b39;font-size:12px}main{max-width:880px;display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:0 auto;padding:0 24px 30px}figure{margin:0}figcaption{font-size:11px;letter-spacing:1px;padding:0 0 12px}img{display:block;width:100%;border-radius:14px;border:1px solid #d7dfd0}.single{background:#f5f7f2}.single header,.single figcaption{display:none}.single main{display:block;max-width:none;margin:0;padding:0}.single img{width:100vw;height:100vh;object-fit:contain;border:0;border-radius:0}.single figure{display:none}.single figure.selected{display:block}@media(max-width:580px){header{display:block}header a{display:inline-block;margin-top:12px}main{gap:12px;padding:0 12px 20px}h1{font-size:19px}figcaption{font-size:9px;letter-spacing:.3px}}
</style></head><body><header><div><h1>One coin. A growing grove.</h1><p>Two still frames · Minimal green · Motion to follow</p></div><a href="index.html?view=home">Explore the app →</a></header><main><figure data-frame="first"><figcaption>01 — A SMALL OFFERING</figcaption><img src="assets/intro/first-frame.svg" alt="First frame, a bamboo coin bank with one coin"></figure><figure data-frame="last"><figcaption>02 — GROWING TOGETHER</figcaption><img src="assets/intro/last-frame.svg" alt="Last frame, a minimal green bamboo grove"></figure></main><script>const frame=new URLSearchParams(location.search).get('frame');if(['first','last'].includes(frame)){document.body.classList.add('single');document.querySelector(`[data-frame="${frame}"]`).classList.add('selected');}</script></body></html>
